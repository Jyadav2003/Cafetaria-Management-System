<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Add Food Item</title>
  <link rel="stylesheet" href="add-food.css" />
</head>
<body>
  <div class="add-container">
    <h2>Add Food Item</h2>
    <form id="add-food-form">
      <label for="food-name">Food Name</label>
      <input type="text" id="food-name" required placeholder="e.g., Paneer Butter Masala" />

      <label for="food-price">Price (₹)</label>
      <input type="number" id="food-price" required placeholder="e.g., 180" />

      <label for="food-category">Category</label>
      <select id="food-category" required>
        <option value="">Select Category</option>
        <option value="Starters">Starters</option>
        <option value="Main Course">Main Course</option>
        <option value="Tiffins">Tiffins</option>
        <option value="Desserts">Desserts</option>
        <option value="Breads">Breads</option>
        <option value="Rice & Biryani">Rice & Biryani</option>
      </select>

      <button type="submit">Add Item</button>
      <p id="success-message" class="hidden">Food item added successfully!</p>
    </form>
  </div>

  <script src="add-food.js"></script>
</body>
</html>
