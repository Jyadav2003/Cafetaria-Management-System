<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delete Food Item</title>
  <link rel="stylesheet" href="delete-food.css">
</head>
<body>

  <div class="container">
    <h1>Delete Food Item</h1>
    <form id="delete-food-form">
      <label for="food-name">Food Name:</label>
      <input type="text" id="food-name" name="food-name" placeholder="Enter food name to delete" required>

      <button type="submit" class="btn-submit">Delete Food Item</button>
    </form>

    <p id="message"></p>
  </div>

  <script src="delete-food.js"></script>
</body>
</html>
