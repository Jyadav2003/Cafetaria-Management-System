<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Payment Portal</title>
  <link rel="stylesheet" href="payment.css"/>
</head>
<body>
  <div class="container">
    <h1>Payment Portal</h1>

    <form id="payment-form">
      <div id="upi-section" class="payment-method">
        <label for="upiId">Enter UPI ID:</label>
        <input type="text" id="upiId" name="upiId" placeholder="example@upi"/>
      </div>

      <div id="card-section" class="payment-method">
        <label for="cardName">Cardholder Name:</label>
        <input type="text" id="cardName" name="cardName"/>

        <label for="cardNumber">Card Number:</label>
        <input type="text" id="cardNumber" name="cardNumber" maxlength="16"/>

        <label for="expiry">Expiry (MM/YY):</label>
        <input type="text" id="expiry" name="expiry" maxlength="5" placeholder="MM/YY"/>

        <label for="cvv">CVV:</label>
        <input type="text" id="cvv" name="cvv" maxlength="3"/>
      </div>

      <button type="submit">Proceed to Pay</button>
    </form>

    <div id="otp-section" style="display: none;">
      <p>OTP sent to your phone.</p>
      <label for="otp">Enter OTP:</label>
      <input type="text" id="otp" maxlength="6"/>
      <button id="verify-otp">Verify OTP</button>
    </div>

    <div id="success-section" style="display: none;">
     <h2>Order Placed Successfully!!!</h2>
     <a href="queue.html">View Receipt</a>
    </div>  </div>

  <script src="payment.js"></script>
</body>
</html>
