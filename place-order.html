<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Place High-Priority Order</title>
  <link rel="stylesheet" href="place-order.css">
</head>
<body>

  <div class="container">
    <h1>Place High-Priority Order</h1>
    <form id="place-order-form">
      <label for="food-name">Food Name:</label>
      <input type="text" id="food-name" name="food-name" placeholder="Enter food name" required>

      <label for="customer-name">Customer Name:</label>
      <input type="text" id="customer-name" name="customer-name" placeholder="Enter customer name" required>

      <button type="submit" class="btn-submit">Place Order with High Priority</button>
    </form>

    <p id="message"></p>
  </div>

  <script src="place-order.js"></script>
</body>
</html>
